name: Extract uploaded zip

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip(s) into repo root
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Extracting $z"
            unzip -o -q "$z" -x "__MACOSX/*" ".github/*"
            rm -f "$z"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "Extract uploaded zip" && git push)
